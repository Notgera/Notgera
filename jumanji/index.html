<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jumanji — Jamoaviy dars o'yini</title>
<style>
  :root {
    --jungle-1: #0f3d2e;
    --jungle-2: #05140d;
    --gold: #ffd166;
    --gold-2: #f4a261;
    --paper: #fffaf0;
    --ink: #1f2a24;
    --ok: #2ecc71;
    --bad: #e74c3c;
    --inset: 34px;      /* burchak medallionining chetdan masofasi */
    --medal: 72px;      /* burchak medallionining o'lchami */
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    color: #f4f4ef;
    background:
      radial-gradient(ellipse at 15% 0%, #2c7048 0%, transparent 55%),
      radial-gradient(ellipse at 95% 100%, #1d5a3a 0%, transparent 50%),
      linear-gradient(180deg, var(--jungle-1), var(--jungle-2));
    background-attachment: fixed;
    overflow-x: hidden;
  }

  /* ---------- Fon bargi ---------- */
  #leaves { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .leaf {
    position: absolute; top: -40px; opacity: .18;
    animation: drift linear infinite;
  }
  @keyframes drift {
    from { transform: translateY(0) rotate(0deg); }
    to   { transform: translateY(120vh) rotate(360deg); }
  }

  header { position: relative; z-index: 1; text-align: center; padding: 28px 12px 8px; }
  h1 {
    margin: 0;
    font-size: clamp(2.2rem, 6vw, 3.4rem);
    font-weight: 900;
    letter-spacing: 6px;
    background: linear-gradient(180deg, #fff1b8, #f4a261);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 4px 0 #5a3412);
  }
  .subtitle {
    margin-top: 8px;
    font-size: .8rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    opacity: .7;
  }

  .screen { position: relative; z-index: 1; display: none; max-width: 1120px; margin: 0 auto; padding: 16px; }
  .screen.active { display: block; animation: fadeUp .4s ease-out; }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: none; }
  }

  /* ---------- Sozlash ---------- */
  .card {
    max-width: 600px;
    margin: 12px auto;
    padding: 28px;
    border-radius: 24px;
    background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.15);
    box-shadow: 0 25px 60px rgba(0,0,0,.35);
    backdrop-filter: blur(10px);
  }
  .card h2.title { margin: 0 0 18px; font-size: 1.5rem; text-align: center; color: var(--gold); }
  .card label { display: block; margin: 0 0 6px; font-weight: 700; font-size: .95rem; opacity: .9; }
  select, input[type="text"] {
    font: inherit;
    padding: 11px 12px;
    border-radius: 12px;
    border: 2px solid transparent;
    background: #fff;
    color: var(--ink);
    outline: none;
    transition: border-color .2s, box-shadow .2s;
  }
  select:focus, input[type="text"]:focus {
    border-color: var(--gold);
    box-shadow: 0 0 0 4px rgba(255,209,102,.25);
  }
  .team-row {
    display: flex; gap: 10px; align-items: center;
    margin: 10px 0;
    padding: 10px;
    border-radius: 16px;
    background: rgba(0,0,0,.18);
  }
  .team-row .num-badge {
    width: 32px; height: 32px; flex-shrink: 0;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: 900; color: #3a2300;
    background: linear-gradient(180deg, #fff1b8, #f4a261);
    box-shadow: 0 3px 0 #b86b1f;
  }
  .team-row input[type="text"] { flex: 1; min-width: 0; }
  .team-row select { font-size: 1.5rem; padding: 4px 8px; }
  .setup-msg { color: #ffb3a8; min-height: 1.4em; margin-top: 12px; text-align: center; font-weight: 600; }

  /* ---------- Tugmalar ---------- */
  button {
    font: inherit;
    font-weight: 800;
    letter-spacing: .3px;
    border: 0;
    border-radius: 14px;
    padding: 13px 20px;
    cursor: pointer;
    color: #fff;
    background: #3b5b47;
    box-shadow: 0 4px 0 rgba(0,0,0,.35);
    transition: transform .1s, box-shadow .1s, filter .2s, opacity .2s;
  }
  button:hover:not(:disabled) { transform: translateY(-2px); filter: brightness(1.08); }
  button:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,.35); }
  button:disabled { opacity: .35; cursor: not-allowed; box-shadow: none; }
  .btn-gold { background: linear-gradient(180deg, #ffe38a, #f4a261); color: #3a2300; box-shadow: 0 4px 0 #b86b1f; }
  .btn-ok   { background: linear-gradient(180deg, #5ee39a, #25a35c); box-shadow: 0 4px 0 #17703c; }
  .btn-bad  { background: linear-gradient(180deg, #ff8a7a, #d8432f); box-shadow: 0 4px 0 #9c2a1b; }
  .btn-ghost { background: rgba(255,255,255,.12); box-shadow: none; }
  .btn-ghost:active:not(:disabled) { box-shadow: none; }
  .center { text-align: center; margin-top: 16px; }

  /* ---------- O'yin ---------- */
  .game-grid {
    display: grid;
    grid-template-columns: minmax(300px, 1.2fr) minmax(290px, 1fr);
    gap: 18px;
    align-items: start;
  }
  @media (max-width: 800px) { .game-grid { grid-template-columns: 1fr; } }

  /* Yog'och taxta */
  .board {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
    padding: 14px;
    background:
      radial-gradient(circle at 10px 10px, #f3d58a 0 6px, #8a6420 7px 8px, transparent 9px),
      radial-gradient(circle at calc(100% - 10px) 10px, #f3d58a 0 6px, #8a6420 7px 8px, transparent 9px),
      radial-gradient(circle at 10px calc(100% - 10px), #f3d58a 0 6px, #8a6420 7px 8px, transparent 9px),
      radial-gradient(circle at calc(100% - 10px) calc(100% - 10px), #f3d58a 0 6px, #8a6420 7px 8px, transparent 9px),
      repeating-linear-gradient(92deg, rgba(0,0,0,.10) 0 2px, transparent 2px 11px),
      repeating-linear-gradient(88deg, rgba(255,220,150,.04) 0 1px, transparent 1px 23px),
      linear-gradient(145deg, #6b4220, #2e1a0b);
    border: 3px solid #b8903f;
    border-radius: 18px;
    box-shadow: inset 0 0 0 2px #2a170a, inset 0 0 0 5px #8a6420, inset 0 0 30px rgba(0,0,0,.6), 0 24px 50px rgba(0,0,0,.6);
  }
  .cell {
    position: relative;
    aspect-ratio: 1 / 1;
    border-radius: 14px;
    background: radial-gradient(circle at 30% 25%, #4f7a3e, #2c4a24 70%, #1a2e16);
    box-shadow: inset 0 0 0 1px rgba(232,194,122,.55), inset 0 0 0 3px rgba(0,0,0,.25), inset 0 -5px 0 rgba(0,0,0,.35), 0 4px 8px rgba(0,0,0,.55);
    overflow: hidden;
  }
  .cell.alt { background: radial-gradient(circle at 30% 25%, #7a5a2c, #4a3218 70%, #2e1e0c); }
  .cell.start, .cell.finish {
    background: radial-gradient(circle at 30% 25%, #fff0b5, #e0b04e 55%, #8a5d1a);
  }
  .cell.finish { animation: glow 1.6s ease-in-out infinite alternate; }
  @keyframes glow {
    to { box-shadow: inset 0 -5px 0 rgba(0,0,0,.15), 0 0 22px 4px rgba(255,209,102,.8); }
  }
  .label {
    position: absolute; top: 4px; left: 6px;
    white-space: nowrap;
    font-family: Georgia, "Times New Roman", serif;
    font-size: .7rem; font-weight: 700;
    color: #e8c27a;
    text-shadow: 0 1px 2px #000;
  }
  .cell.start .label, .cell.finish .label { color: #3a2300; text-shadow: none; }
  .tokens {
    position: absolute; inset: 0;
    display: flex; flex-wrap: wrap;
    align-items: center; justify-content: center;
    padding: 16px 2px 2px;
    gap: 0 2px;
    font-size: clamp(.85rem, 2.4vw, 1.35rem);
    line-height: 1.1;
    filter: drop-shadow(0 3px 2px rgba(0,0,0,.4));
  }
  .tok.active { animation: bounce .6s infinite alternate; }
  @keyframes bounce { to { transform: translateY(-5px) scale(1.2); } }

  /* Taxta burchaklaridagi haqiqiy rasmlar (medallionlar) */
  .board-wrap {
    position: relative;
    padding: 62px;
  }
  .medal {
    position: absolute;
    width: var(--medal); height: var(--medal);
    padding: 4px;
    border-radius: 50%;
    border: 3px solid #d4a94f;
    background: radial-gradient(circle at 35% 30%, #5a3a1c, #2a170a 75%);
    box-shadow: 0 0 0 2px #2a170a, 0 6px 14px rgba(0,0,0,.65);
    transform: translate(-50%, -50%);
    transition: transform .2s;
    cursor: help;
    z-index: 2;
  }
  .medal:hover { transform: translate(-50%, -50%) scale(1.12); }
  .medal .pic { display: block; width: 100%; height: 100%; border-radius: 50%; overflow: hidden; }
  .medal .pic img, .medal .pic svg {
    width: 100%; height: 100%; display: block; object-fit: cover; border-radius: 50%;
  }
  .pic { display: block; width: 100%; height: 100%; }
  /* Filmdagi kabi yashil shisha shar — taxta markazida tepada */
  .orb {
    position: absolute; left: 50%; top: var(--inset);
    width: 46px; height: 46px;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #e6ffe9, #34d17a 30%, #0d6b3a 70%, #053320);
    box-shadow: 0 0 0 3px #d4a94f, 0 0 0 5px #2a170a, 0 0 22px 6px rgba(70,255,150,.55);
    animation: orb 2.4s ease-in-out infinite alternate;
    z-index: 2;
  }
  @keyframes orb {
    to { box-shadow: 0 0 0 3px #d4a94f, 0 0 0 5px #2a170a, 0 0 34px 10px rgba(70,255,150,.8); }
  }
  .credit {
    margin-top: 10px;
    text-align: center;
    font-size: .72rem;
    opacity: .6;
  }
  @media (max-width: 560px) {
    :root { --inset: 22px; --medal: 54px; }
    .board-wrap { padding: 44px; }
    .label { font-size: .55rem; top: 2px; left: 3px; }
    .tokens { padding-top: 12px; }
  }

  /* Boshqaruv paneli */
  .panel {
    padding: 18px;
    border-radius: 24px;
    background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.12);
    backdrop-filter: blur(8px);
    display: flex; flex-direction: column; gap: 14px;
  }
  .turn {
    text-align: center;
    padding: 12px;
    border-radius: 16px;
    background: linear-gradient(135deg, rgba(255,209,102,.2), rgba(255,209,102,.04));
    border: 1px solid rgba(255,209,102,.35);
  }
  .turn .small { font-size: .75rem; letter-spacing: 2px; text-transform: uppercase; opacity: .75; }
  .turn .team { font-size: 1.6rem; font-weight: 900; color: var(--gold); margin-top: 4px; }

  .dice-row { display: flex; align-items: center; justify-content: center; gap: 16px; }
  .dice-box {
    width: 92px; height: 92px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 3.8rem; line-height: 1; color: #222;
    border-radius: 22px;
    background: linear-gradient(145deg, #ffffff, #dcdcdc);
    box-shadow: inset 0 -6px 0 #bdbdbd, 0 12px 22px rgba(0,0,0,.45);
  }
  .dice-box.rolling { animation: shake .45s infinite; }
  @keyframes shake {
    0%, 100% { transform: rotate(-10deg); }
    50%      { transform: rotate(10deg) scale(1.05); }
  }
  .dice-num { font-size: .95rem; opacity: .9; }
  .dice-num b { display: block; font-size: 2rem; color: var(--gold); line-height: 1.1; }

  .btns { display: flex; gap: 10px; flex-wrap: wrap; }
  .btns button { flex: 1; min-width: 120px; }
  .btns.single button { width: 100%; }

  /* Savol kartasi (qog'oz ko'rinishida) */
  .question {
    position: relative;
    min-height: 130px;
    padding: 20px 22px 18px;
    border-radius: 18px;
    background: var(--paper);
    color: var(--ink);
    border-top: 6px solid var(--gold);
    box-shadow: 0 12px 28px rgba(0,0,0,.35);
  }
  .question.anim { animation: fadeUp .4s ease-out; }
  .qtext { margin: 0; font-size: 1.3rem; font-weight: 700; line-height: 1.4; }
  .qanswer {
    margin-top: 12px; padding: 9px 12px;
    border-radius: 10px;
    background: #dff5e6; color: #1b5e2f; font-weight: 700;
  }
  .qhint {
    display: inline-block; margin-top: 12px;
    padding: 5px 12px; border-radius: 99px;
    background: #1f5f3a; color: #fff; font-size: .8rem; font-weight: 600;
  }
  .qhint:empty { display: none; }

  /* Xabar banneri */
  #msg {
    min-height: 46px;
    display: flex; align-items: center; justify-content: center;
    padding: 8px 14px;
    border-radius: 14px;
    text-align: center; font-weight: 800;
    background: rgba(255,255,255,.06);
    color: var(--gold);
    transition: background .3s, color .3s;
  }
  #msg.ok  { background: rgba(46,204,113,.22); color: #9ff3c0; }
  #msg.bad { background: rgba(231,76,60,.22); color: #ffc2b9; }

  .winner {
    padding: 18px;
    border-radius: 20px;
    text-align: center;
    font-size: 1.4rem; font-weight: 900;
    color: #3a2300;
    background: linear-gradient(135deg, #ffe38a, #f4a261);
    box-shadow: 0 10px 30px rgba(255,209,102,.4);
    animation: pulse 1.2s infinite alternate;
  }
  @keyframes pulse { to { transform: scale(1.04); } }

  /* Natijalar */
  h2.sec { margin: 0 0 8px; font-size: 1rem; letter-spacing: 2px; text-transform: uppercase; color: var(--gold); }
  ul.score { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; }
  ul.score li {
    padding: 10px 12px;
    border-radius: 14px;
    background: rgba(0,0,0,.25);
    border: 2px solid rgba(255,255,255,.05);
    transition: border-color .3s, box-shadow .3s;
  }
  ul.score li.current { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(255,209,102,.2); }
  .sc-head { font-weight: 800; }
  .bar {
    height: 12px; margin: 7px 0 4px;
    border-radius: 99px; overflow: hidden;
    background: rgba(255,255,255,.12);
  }
  .fill {
    height: 100%; border-radius: 99px;
    background: linear-gradient(90deg, #ffd166, #f4a261);
    transition: width .4s ease;
  }
  ul.score small { opacity: .75; }
  .footer-btns { display: flex; justify-content: flex-end; }

  /* Konfetti */
  .confetti {
    position: fixed; top: -20px; z-index: 9;
    width: 10px; height: 14px; border-radius: 3px;
    pointer-events: none;
    animation: fall linear forwards;
  }
  @keyframes fall {
    to { transform: translateY(110vh) rotate(720deg); }
  }
  /* ---------- Vaqt chegarasi, maxsus katakchalar, katta rejim ---------- */
  .timer {
    position: relative; height: 26px; border-radius: 99px; overflow: hidden;
    background: rgba(0,0,0,.35);
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: .85rem;
  }
  .timer-fill { position: absolute; left: 0; top: 0; bottom: 0; background: linear-gradient(90deg, #2ecc71, #ffd166); }
  .timer.low .timer-fill { background: linear-gradient(90deg, #e74c3c, #ff8a7a); }
  .timer span { position: relative; text-shadow: 0 1px 2px #000; }
  .cell .spec { position: absolute; top: 2px; right: 4px; font-size: .9rem; z-index: 1; filter: drop-shadow(0 1px 1px #000); }
  /* Maxsus katakchalar: sher = sariq, ilon = ko'k, bo'ron = qora */
  .cell.sp-up {
    background: radial-gradient(circle at 30% 25%, #fff6a8, #ffd33d 55%, #b8860b);
    box-shadow: inset 0 -5px 0 rgba(0,0,0,.25), 0 4px 8px rgba(0,0,0,.55);
  }
  .cell.sp-up .label { color: #3a2300; text-shadow: none; }
  .cell.sp-down {
    background: radial-gradient(circle at 30% 25%, #6fb1ff, #1f6fe0 55%, #0b3d91);
    box-shadow: inset 0 -5px 0 rgba(0,0,0,.35), 0 4px 8px rgba(0,0,0,.55);
  }
  .cell.sp-skip {
    background: radial-gradient(circle at 30% 25%, #4a4a4a, #161616 60%, #000);
    box-shadow: inset 0 0 0 1px rgba(232,194,122,.35), inset 0 -5px 0 rgba(0,0,0,.6), 0 4px 8px rgba(0,0,0,.55);
  }
  .big-toggle { position: fixed; top: 12px; right: 12px; z-index: 20; padding: 8px 12px; font-size: .85rem; }

  body.big .qtext { font-size: 1.9rem; }
  body.big .turn .team { font-size: 2.4rem; }
  body.big .turn .small { font-size: 1rem; }
  body.big .dice-num { font-size: 1.2rem; }
  body.big .dice-num b { font-size: 3rem; }
  body.big button { font-size: 1.25rem; padding: 16px 22px; }
  body.big #msg { font-size: 1.4rem; min-height: 70px; }
  body.big .sc-head { font-size: 1.3rem; }
  body.big ul.score small { font-size: 1rem; }
  body.big h2.sec { font-size: 1.3rem; }
  body.big .label { font-size: 1rem; }
  body.big .spec { font-size: 1.2rem; }
  body.big .tokens { font-size: clamp(1.3rem, 3.5vw, 2.2rem); }
  body.big .timer { height: 34px; font-size: 1.2rem; }
  body.big .winner { font-size: 2.2rem; }
  body.big .qhint { font-size: 1.1rem; }
  body.big label, body.big select, body.big input { font-size: 1.2rem; }
</style>
</head>
<body>

<div id="leaves"></div>
<button class="btn-ghost big-toggle" id="bigBtn">🔍 Katta shrift</button>

<header>
  <h1>JUMANJI</h1>
</header>

<!-- ============ 1-EKRAN: SOZLASH ============ -->
<section id="setup" class="screen active">
  <div class="card">
    <h2 class="title">Jamoa sozlamalari</h2>

    <label for="teamCount">Jamoalar soni</label>
    <select id="teamCount">
      <option value="2">2 ta jamoa</option>
      <option value="3">3 ta jamoa</option>
      <option value="4" selected>4 ta jamoa</option>
      <option value="5">5 ta jamoa</option>
      <option value="6">6 ta jamoa</option>
    </select>

    <div id="teamRows"></div>

    <div class="setup-msg" id="setupMsg"></div>
    <div class="center">
      <button class="btn-gold" id="startBtn">▶ O'yinni boshlash</button>
    </div>
  </div>
</section>

<!-- ============ 2-EKRAN: O'YIN ============ -->
<section id="game" class="screen">
  <div class="game-grid">

    <div>
      <div class="board-wrap" id="boardWrap">
        <div class="board" id="board"></div>
      </div>
    </div>

    <div class="panel">
      <div class="turn">
        <div class="small">Navbat</div>
        <div class="team" id="turnTeam">—</div>
      </div>

      <div class="dice-row">
        <div class="dice-box" id="dice">🎲</div>
        <div class="dice-num">Tushgan son<b id="diceNum">–</b></div>
      </div>

      <div class="btns single">
        <button class="btn-gold" id="rollBtn">🎲 Zarni tashlash</button>
      </div>

      <div class="question" id="qCard">
        <p class="qtext" id="qText">Zarni tashlang — savol shu yerda chiqadi.</p>
        <div class="qhint" id="qHint"></div>
      </div>

      <div class="timer" id="timerBox" hidden>
        <div class="timer-fill" id="timerFill"></div>
        <span id="timerSec"></span>
      </div>

      <div class="btns">
        <button class="btn-ok" id="okBtn" disabled>✅ To'g'ri</button>
        <button class="btn-bad" id="badBtn" disabled>❌ Noto'g'ri</button>
      </div>

      <div id="msg"></div>

      <div class="winner" id="winnerBox" hidden>
        <div id="winnerText"></div>
      </div>

      <div>
        <h2 class="sec">Natijalar</h2>
        <ul class="score" id="scoreList"></ul>
      </div>

      <div class="footer-btns">
        <button class="btn-ghost" id="newBtn">🔄 Yangi o'yin</button>
      </div>
    </div>

  </div>
</section>

<script>
/* =====================================================================
   SAVOLLAR — shu yerni o'zgartiring.
   Hozirgi savollar namuna. O'z mavzuingizdagi savollar bilan almashtiring.
   Format: { q: "savol matni", a: "to'g'ri javob" }
   ===================================================================== */
const QUESTIONS = [
  { q: "O'zbekistonning poytaxti qaysi shahar?", a: "Toshkent" },
  { q: "Suvning kimyoviy formulasi qanday?", a: "H₂O" },
  { q: "Yerning yagona tabiiy yo'ldoshi qaysi?", a: "Oy" },
  { q: "Eng katta okean qaysi?", a: "Tinch okeani" },
  { q: "Bir yilda necha oy bor?", a: "12" },
  { q: "Normal bosimda suv necha gradusda qaynaydi (Selsiy)?", a: "100 daraja" },
  { q: "Quyosh sistemasidagi eng katta sayyora qaysi?", a: "Yupiter" },
  { q: "O'zbekistonning pul birligi qaysi?", a: "So'm" },
  { q: "Hayvonlar shohi deb qaysi hayvon ataladi?", a: "Sher" },
  { q: "Bir haftada necha kun bor?", a: "7" },
];

/* ---------- Sozlamalar ---------- */
const TOKENS = ["🦁", "🐒", "🐍", "🦜", "🐘", "🦒"];
const COLS = 6;

/* Burchaklardagi joylashuv: 0 = yuqori chap, 1 = yuqori o'ng, 2 = pastki chap, 3 = pastki o'ng */
const LANDMARK_POS = [
  { left: "var(--inset)", top: "var(--inset)" },
  { left: "calc(100% - var(--inset))", top: "var(--inset)" },
  { left: "var(--inset)", top: "calc(100% - var(--inset))" },
  { left: "calc(100% - var(--inset))", top: "calc(100% - var(--inset))" },
];

/* Rasm manzili: Wikimedia Commons, kengligi 600px (aniq ko'rinishi uchun) */
function commonsUrl(file) {
  return "https://commons.wikimedia.org/wiki/Special:FilePath/" + encodeURIComponent(file) + "?width=600";
}

/* SVG chizma darhol ko'rinadi, rasm yuklansa u bilan almashtiriladi */
function picEl(lm) {
  const span = document.createElement("span");
  span.className = "pic";
  span.innerHTML = lm.svg;
  if (lm.img) {
    const img = new Image();
    img.alt = lm.name;
    img.onload = () => { span.innerHTML = ""; span.appendChild(img); };
    img.src = lm.img.startsWith("data:") ? lm.img : commonsUrl(lm.img);
  }
  return span;
}

/* ---------- Holat ---------- */
let state = null;                 // { teams, current, phase, dice, question, winner }
let questionBag = [];
let cellEls = [];

const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function show(screenId) {
  document.querySelectorAll(".screen").forEach(s => s.classList.toggle("active", s.id === screenId));
}

/* kind: "ok" (yashil), "bad" (qizil) yoki bo'sh (oddiy) */
function setMsg(text, kind = "") {
  const el = $("msg");
  el.textContent = text;
  el.className = kind;
}

function replayAnim(el, cls) {
  el.classList.remove(cls);
  void el.offsetWidth;          // animatsiyani qayta boshlash uchun
  el.classList.add(cls);
}

/* ---------- Dekor: uchib yuruvchi barglar ---------- */
function makeLeaves() {
  const box = $("leaves");
  for (let i = 0; i < 12; i++) {
    const s = document.createElement("span");
    s.className = "leaf";
    s.textContent = LEAF_ICONS[i % LEAF_ICONS.length];
    s.style.left = Math.random() * 100 + "vw";
    s.style.fontSize = (18 + Math.random() * 18) + "px";
    s.style.animationDuration = (16 + Math.random() * 14) + "s";
    s.style.animationDelay = (-Math.random() * 25) + "s";
    box.appendChild(s);
  }
}

/* ---------- Sozlash ekrani ---------- */
function renderSetup() {
  const n = +$("teamCount").value;
  const box = $("teamRows");
  box.innerHTML = "";
  for (let i = 0; i < n; i++) {
    const row = document.createElement("div");
    row.className = "team-row";

    const badge = document.createElement("span");
    badge.className = "num-badge";
    badge.textContent = i + 1;

    const name = document.createElement("input");
    name.type = "text";
    name.maxLength = 20;
    name.placeholder = `Jamoa ${i + 1} nomi`;
    name.value = `Jamoa ${i + 1}`;
    name.dataset.name = "1";

    const tok = document.createElement("select");
    tok.dataset.token = "1";
    TOKENS.forEach((t, k) => {
      const opt = document.createElement("option");
      opt.value = t;
      opt.textContent = t;
      if (k === i) opt.selected = true;   // har bir jamoaga boshqa token
      tok.appendChild(opt);
    });

    row.append(badge, name, tok);
    box.appendChild(row);
  }
  $("setupMsg").textContent = "";
}

function startGame() {
  const rows = [...document.querySelectorAll(".team-row")];
  const teams = rows.map((r, i) => ({
    name: r.querySelector("[data-name]").value.trim() || `Jamoa ${i + 1}`,
    token: r.querySelector("[data-token]").value,
    pos: 0,
  }));

  const tokens = teams.map(t => t.token);
  if (new Set(tokens).size !== tokens.length) {
    $("setupMsg").textContent = "Har bir jamoa uchun boshqa token tanlang.";
    return;
  }

  state = { teams, current: 0, phase: "roll", dice: 0, question: null, winner: null };
  questionBag = [];
  show("game");
  render();
  setMsg(`Navbat: ${teams[0].name}. Zarni tashlang!`);
}

/* ---------- O'yin taxtasi ---------- */
function buildBoard() {
  const board = $("board");
  board.innerHTML = "";
  cellEls = [];
  const rows = CELLS / COLS;

  // Ekranda yuqoridan pastga. Qatorlar ilon yo'li kabi navbatma-navbat yo'naladi.
  for (let d = 0; d < rows; d++) {
    const logicalRow = rows - 1 - d;          // 0 = eng pastki qator
    for (let c = 0; c < COLS; c++) {
      const logicalCol = logicalRow % 2 === 0 ? c : COLS - 1 - c;
      const idx = logicalRow * COLS + logicalCol;

      const cell = document.createElement("div");
      cell.className = "cell " + (idx === 0 ? "start" : idx === FINISH ? "finish" : (idx % 2 ? "alt" : ""));

      const label = document.createElement("span");
      label.className = "label";
      label.textContent = idx === 0 ? "START" : idx === FINISH ? "🏁" : idx;

      const tk = document.createElement("div");
      tk.className = "tokens";

      const sp = SPECIALS[idx];
      if (sp) {
        cell.classList.add("sp-" + sp.type);
        const ic = document.createElement("span");
        ic.className = "spec";
        ic.textContent = sp.icon;
        ic.title = sp.text;
        cell.appendChild(ic);
      }
      cell.append(label, tk);
      board.appendChild(cell);
      cellEls[idx] = tk;
    }
  }
}

/* Taxta burchaklaridagi 4 ta medallion */
function buildLandmarks() {
  const wrap = $("boardWrap");
  wrap.querySelectorAll(".medal, .orb").forEach(el => el.remove());

  const orb = document.createElement("div");
  orb.className = "orb";
  orb.title = "Jumanji ko'zi";
  wrap.appendChild(orb);

  LANDMARKS.forEach((lm, i) => {
    const m = document.createElement("div");
    m.className = "medal";
    m.title = lm.name;
    m.appendChild(picEl(lm));
    m.style.left = LANDMARK_POS[i].left;
    m.style.top = LANDMARK_POS[i].top;
    wrap.appendChild(m);
  });
}

function renderBoard() {
  cellEls.forEach(el => { el.textContent = ""; });
  const isOver = state.phase === "over";
  state.teams.forEach((t, i) => {
    const span = document.createElement("span");
    span.className = "tok" + (i === state.current && !isOver ? " active" : "");
    span.textContent = t.token;
    span.title = t.name;
    cellEls[t.pos].appendChild(span);
  });
}

/* ---------- Natijalar paneli ---------- */
function renderScore() {
  const list = $("scoreList");
  list.innerHTML = "";
  const isOver = state.phase === "over";
  state.teams.forEach((t, i) => {
    const li = document.createElement("li");
    if (i === state.current && !isOver) li.className = "current";

    const head = document.createElement("div");
    head.className = "sc-head";
    head.textContent = `${t.token} ${t.name}`;

    const bar = document.createElement("div");
    bar.className = "bar";
    const fill = document.createElement("div");
    fill.className = "fill";
    fill.style.width = Math.round((t.pos / FINISH) * 100) + "%";
    bar.appendChild(fill);

    const info = document.createElement("small");
    info.textContent = `${t.pos} / ${FINISH} katak`;

    li.append(head, bar, info);
    list.appendChild(li);
  });
}

/* ---------- Asosiy render ---------- */
function render() {
  if (!state) return;
  const t = state.teams[state.current];
  const p = state.phase;

  $("turnTeam").textContent = `${t.token} ${t.name}`;

  $("rollBtn").disabled = p !== "roll";
  const asking = p === "question";
  $("okBtn").disabled = !asking;
  $("badBtn").disabled = !asking;
  $("newBtn").disabled = p === "rolling" || p === "busy";

  $("winnerBox").hidden = p !== "over";
  $("timerBox").hidden = p !== "question";

  renderBoard();
  renderScore();
}

/* ---------- Zar tashlash ---------- */
function rollDice() {
  if (!state || state.phase !== "roll") return;
  state.phase = "rolling";
  render();

  const diceEl = $("dice");
  diceEl.classList.add("rolling");
  let ticks = 0;
  const timer = setInterval(() => {
    diceEl.textContent = FACES[Math.floor(Math.random() * 6)];
    ticks++;
    if (ticks >= 12) {
      clearInterval(timer);
      diceEl.classList.remove("rolling");
      const n = 1 + Math.floor(Math.random() * 6);   // 1 dan 6 gacha
      state.dice = n;
      diceEl.textContent = FACES[n - 1];
      $("diceNum").textContent = n;
      askQuestion();
    }
  }, 70);
}

/* ---------- Savol ---------- */
function nextQuestion() {
  if (questionBag.length === 0) {
    questionBag = shuffle(QUESTIONS.map((_, i) => i));   // hamma savol tugagach qayta aralashtiriladi
  }
  return QUESTIONS[questionBag.pop()];
}

function askQuestion() {
  state.phase = "question";
  state.question = nextQuestion();

  $("qText").textContent = state.question.q;
  $("qHint").textContent = `To'g'ri javob bo'lsa token ${state.dice} qadam yuradi.`;
  replayAnim($("qCard"), "anim");
  startTimer();

  render();
  setMsg(`${state.teams[state.current].name} javob bermoqda...`);
}

/* ---------- Javob (to'g'ri / noto'g'ri) ---------- */
async function answer(correct, timedOut = false) {
  if (!state || state.phase !== "question") return;
  stopTimer();
  state.phase = "busy";
  render();

  const team = state.teams[state.current];

  if (correct) {
    setMsg(`✅ To'g'ri! ${team.name} ${state.dice} qadam yuradi.`, "ok");
    for (let i = 0; i < state.dice && team.pos < FINISH; i++) {
      team.pos++;
      renderBoard();
      renderScore();
      await sleep(STEP_DELAY);
    }
    if (team.pos >= FINISH) {
      finishGame(team);
      return;
    }
    await applySpecial(team);
    if (team.pos >= FINISH) {
      finishGame(team);
      return;
    }
  } else {
    setMsg(timedOut
      ? `⏰ Vaqt tugadi! ${team.name} joyida qoladi.`
      : `❌ Noto'g'ri. ${team.name} joyida qoladi.`, "bad");
  }

  await sleep(1200);
  nextTurn();
}

/* Token maxsus katakchaga tushsa, ta'sirini qo'llash */
async function applySpecial(team) {
  const sp = SPECIALS[team.pos];
  if (!sp) return;
  await sleep(600);
  if (sp.type === "skip") {
    team.skip = true;
    setMsg(`${sp.icon} ${team.name}: ${sp.text}`, "bad");
  } else {
    team.pos = Math.max(0, Math.min(FINISH, team.pos + sp.delta));
    renderBoard();
    renderScore();
    setMsg(`${sp.icon} ${team.name}: ${sp.text}`, sp.type === "up" ? "ok" : "bad");
  }
  await sleep(900);
}

/* ---------- Vaqt chegarasi ---------- */
let timerId = null;

function startTimer() {
  stopTimer();
  const end = Date.now() + TIME_LIMIT * 1000;
  const fill = $("timerFill");
  const txt = $("timerSec");
  const box = $("timerBox");
  box.classList.remove("low");

  const tick = () => {
    const left = Math.max(0, end - Date.now());
    fill.style.width = (left / (TIME_LIMIT * 1000) * 100) + "%";
    txt.textContent = Math.ceil(left / 1000) + " s";
    box.classList.toggle("low", left <= 5000);
    if (left <= 0) {
      stopTimer();
      answer(false, true);
    }
  };
  tick();
  timerId = setInterval(tick, 100);
}

function stopTimer() {
  if (timerId !== null) {
    clearInterval(timerId);
    timerId = null;
  }
}

/* ---------- Katta shrift rejimi (eslab qolinadi) ---------- */
function toggleBig() {
  document.body.classList.toggle("big");
  try {
    localStorage.setItem("jumanjiBig", document.body.classList.contains("big") ? "1" : "0");
  } catch (e) { /* saqlab bo'lmasa ham o'yin ishlayveradi */ }
}

function nextTurn() {
  // Bo'ron tushgan jamoa navbatini bir marta o'tkazib yuboradi
  const n = state.teams.length;
  let next = (state.current + 1) % n;
  let skipped = null;
  if (state.teams[next].skip) {
    state.teams[next].skip = false;
    skipped = state.teams[next].name;
    next = (next + 1) % n;
  }
  state.current = next;
  state.phase = "roll";
  state.dice = 0;
  state.question = null;

  $("dice").textContent = "🎲";
  $("diceNum").textContent = "–";
  $("qText").textContent = "Zarni tashlang — savol shu yerda chiqadi.";
  $("qHint").textContent = "";

  render();
  const t = state.teams[state.current];
  setMsg(skipped
    ? `🌪 ${skipped} o'tkazib yuborildi. Navbat: ${t.name}`
    : `Navbat: ${t.name}. Zarni tashlang!`);
}

function finishGame(team) {
  state.phase = "over";
  state.winner = team;
  $("winnerText").textContent = `🏆 ${team.token} ${team.name} yutdi!`;
  $("qText").textContent = "O'yin tugadi!";
  $("qHint").textContent = "";
  setMsg("🎉 Tabriklaymiz!", "ok");
  render();
  confetti();
}

/* ---------- G'olib konfetti ---------- */
function confetti() {
  const colors = ["#ffd166", "#f4a261", "#2ecc71", "#e74c3c", "#3498db", "#ff6fb1"];
  for (let i = 0; i < 120; i++) {
    const p = document.createElement("span");
    p.className = "confetti";
    p.style.left = Math.random() * 100 + "vw";
    p.style.background = colors[i % colors.length];
    p.style.animationDuration = (2 + Math.random() * 2.5) + "s";
    p.style.animationDelay = (Math.random() * 0.8) + "s";
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 5000);
  }
}

/* ---------- Yangi o'yin ---------- */
function newGame() {
  if (state && state.phase !== "over" && !confirm("Yangi o'yin boshlansinmi? Joriy natijalar o'chadi.")) return;
  stopTimer();
  state = null;
  questionBag = [];
  cellEls.forEach(el => { el.textContent = ""; });
  $("dice").textContent = "🎲";
  $("diceNum").textContent = "–";
  $("qText").textContent = "Zarni tashlang — savol shu yerda chiqadi.";
  $("qHint").textContent = "";
  $("winnerBox").hidden = true;
  setMsg("");
  renderSetup();
  show("setup");
}

/* ---------- Ishga tushirish ---------- */
$("teamCount").addEventListener("change", renderSetup);
$("startBtn").addEventListener("click", startGame);
$("rollBtn").addEventListener("click", rollDice);
$("okBtn").addEventListener("click", () => answer(true));
$("badBtn").addEventListener("click", () => answer(false));
$("newBtn").addEventListener("click", newGame);
$("bigBtn").addEventListener("click", toggleBig);
try {
  if (localStorage.getItem("jumanjiBig") === "1") document.body.classList.add("big");
} catch (e) { /* ignore */ }

if (QUESTIONS.length === 0) {
  $("setupMsg").textContent = "Diqqat: savollar ro'yxati bo'sh.";
}
makeLeaves();
buildBoard();
buildLandmarks();
renderSetup();
</script>
</body>
